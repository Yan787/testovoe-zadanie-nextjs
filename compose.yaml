services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer
      POSTGRES_DB: interview_trainer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d interview_trainer"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
